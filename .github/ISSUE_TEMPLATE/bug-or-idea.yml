name: Bug, idea or question
description: Something that does not work as described, an idea, or a question about a plugin or a skill.
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Keep personal data out of it: no address, phone number, email, Notion page or mailbox screenshot, yours or anyone else's. For something private, write to support@florianbelliard.com instead.

        A security problem never goes here: use **Report a security problem** on the previous page.
  - type: input
    id: plugin
    attributes:
      label: Plugin or skill
      description: For example `rental-search`, or `rental-search:run` for one skill.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where you use it
      options:
        - Claude desktop app (Cowork)
        - claude.ai
        - Claude Code
        - Another agent
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened, or what you would like
      description: For a bug, what you asked, what the agent did, and what you expected instead.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This issue holds no personal data, mine or anyone else's.
          required: true
